workflows:
  ios-ipa:
    name: 云端打包IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: "27.2"
    scripts:
      - name: 安装 XcodeGen
        script: brew install xcodegen
      - name: 生成 Xcode 工程
        script: xcodegen generate
      - name: 无签名编译并打包成 IPA
        script: |
          set -e
          xcodebuild \
            -project SkillClock.xcodeproj \
            -scheme SkillClock \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/SkillClock.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p build/Payload
          cp -R "build/SkillClock.xcarchive/Products/Applications/SkillClock.app" build/Payload/
          cd build && zip -r SkillClock.ipa Payload
    artifacts:
      - build/SkillClock.ipa
